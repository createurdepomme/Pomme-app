<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomme</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f2f2f2;
}

.card {
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  width:300px;
}

.hidden { display:none; }

button {
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#appleBtn {
  font-size:70px;
  border-radius:50%;
  width:160px;
  height:160px;
}
</style>
</head>

<body>

<!-- PSEUDO -->
<div class="card" id="screen-name">
  <h2>🍎 Pomme</h2>
  <input id="nameInput" placeholder="Pseudo">
  <button id="nameConfirmBtn">Jouer</button>
</div>

<!-- GAME -->
<div class="card hidden" id="screen-game">
  <button id="appleBtn">🍎</button>
  <div id="counter">0</div>
</div>

<!-- END -->
<div class="card hidden" id="screen-end">
  <div id="finalMsg"></div>
  <div id="leaderboard-panel"></div>
</div>

<script>
/* ================= SUPABASE ================= */

const SUPABASE_URL = "https://qaofelxfekofzkuhsvir.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhb2ZlbHhmZWtvZnprdWhzdmlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Mzg3NjAsImV4cCI6MjA5MzExNDc2MH0.eQI91OCDJVRz-dFr6omZlAlhQtZ06xMslArTduZJRC8"; // 🔴 mets ta clé anon ici

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */

let clicks = 0;
let playerName = "";

/* ================= DOM ================= */

const screenName = document.getElementById("screen-name");
const screenGame = document.getElementById("screen-game");
const screenEnd = document.getElementById("screen-end");

const btn = document.getElementById("appleBtn");
const counter = document.getElementById("counter");
const nameBtn = document.getElementById("nameConfirmBtn");
const input = document.getElementById("nameInput");

/* ================= NAV ================= */

function show(screen) {
  screenName.classList.add("hidden");
  screenGame.classList.add("hidden");
  screenEnd.classList.add("hidden");
  screen.classList.remove("hidden");
}

/* ================= START GAME ================= */

function startGame() {
  clicks = 0;
  counter.textContent = "0";
  show(screenGame);
}

/* ================= PSEUDO ================= */

nameBtn.addEventListener("click", () => {
  const val = input.value.trim();
  if (!val) return;

  playerName = val;
  startGame();
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") nameBtn.click();
});

/* ================= CLICK ================= */

btn.addEventListener("click", () => {
  clicks++;
  counter.textContent = clicks;

  if (clicks >= 10) endGame();
});

/* ================= END GAME ================= */

async function endGame() {
  show(screenEnd);

  document.getElementById("finalMsg").textContent =
    `${playerName} : ${clicks} clics`;

  await saveScore();
  renderLeaderboard();
}

/* ================= SUPABASE SAVE ================= */

async function saveScore() {
  const { error } = await supabase
    .from("scores")
    .insert([{ name: playerName, score: clicks }]);

  if (error) console.log("Supabase error:", error);
}

/* ================= LEADERBOARD ================= */

async function renderLeaderboard() {
  const panel = document.getElementById("leaderboard-panel");

  const { data, error } = await supabase
    .from("scores")
    .select("*")
    .order("score", { ascending: false })
    .limit(10);

  if (error) {
    panel.innerHTML = "Erreur leaderboard";
    console.log(error);
    return;
  }

  panel.innerHTML = data
    .map((e, i) => `<div>#${i+1} ${e.name} - ${e.score}</div>`)
    .join("");
}

console.log("Jeu chargé OK");
</script>

</body>
</html>
