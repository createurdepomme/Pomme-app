<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎Pomme</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#b8f5b1,#e8ffd8);
  overflow:hidden;
}

.game{
  width:360px;
  background:rgba(255,255,255,0.9);
  padding:30px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  backdrop-filter:blur(10px);
}

h1{
  margin-top:0;
  color:#2e7d32;
  font-size:40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.stat{
  flex:1;
  background:#f4fff1;
  padding:10px;
  border-radius:16px;
  font-weight:bold;
  color:#2e7d32;
}

.stat span{
  display:block;
  font-size:22px;
  margin-top:5px;
}

#appleBtn{
  width:200px;
  height:200px;
  border:none;
  border-radius:50%;
  background:white;
  font-size:100px;
  cursor:pointer;
  box-shadow:
    0 10px 20px rgba(0,0,0,0.2),
    inset 0 -8px 10px rgba(0,0,0,0.08);

  transition:0.1s;
}

#appleBtn:hover{
  transform:scale(1.05);
}

#appleBtn:active{
  transform:scale(0.9);
}

#message{
  margin-top:20px;
  min-height:30px;
  font-size:22px;
  font-weight:bold;
  color:#2e7d32;
}

#achievements{
  margin-top:20px;
  text-align:left;
}

.achievement{
  background:#fff8c4;
  padding:10px;
  border-radius:12px;
  margin-bottom:8px;
  font-weight:bold;
}

.popup{
  position:fixed;
  font-size:32px;
  font-weight:bold;
  pointer-events:none;
  animation:popup 1s forwards;
}

@keyframes popup{
  0%{
    transform:translateY(0) scale(0.5);
    opacity:1;
  }

  100%{
    transform:translateY(-120px) scale(1.2);
    opacity:0;
  }
}

.confetti{
  position:fixed;
  font-size:30px;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  from{
    transform:translateY(-100px) rotate(0deg);
    opacity:1;
  }

  to{
    transform:translateY(120vh) rotate(720deg);
    opacity:0;
  }
}

#gameOver{
  margin-top:20px;
  font-size:28px;
  color:#c62828;
  font-weight:bold;
}

#restartBtn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#43a047;
  color:white;
  font-size:18px;
  cursor:pointer;
  display:none;
}
</style>
</head>

<body>

<div class="game">

  <h1>🍎 Pomme PRO</h1>

  <div class="topbar">

    <div class="stat">
      ⏱ Temps
      <span id="timer">30</span>
    </div>

    <div class="stat">
      🏆 Score
      <span id="score">0</span>
    </div>

    <div class="stat">
      🔥 Combo
      <span id="combo">0</span>
    </div>

  </div>

  <button id="appleBtn">🍎</button>

  <div id="message">
    Clique sur la pomme 🍎
  </div>

  <div id="gameOver"></div>

  <button id="restartBtn">
    Rejouer
  </button>

  <div id="achievements"></div>

</div>

<script>

let score = 0;
let combo = 0;
let timer = 30;

let gameStarted = false;
let gameOver = false;

let comboTimeout;

const achievements = [];

const appleBtn = document.getElementById("appleBtn");
const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const timerEl = document.getElementById("timer");
const messageEl = document.getElementById("message");
const achievementsEl = document.getElementById("achievements");
const gameOverEl = document.getElementById("gameOver");
const restartBtn = document.getElementById("restartBtn");

function startTimer(){

  const interval = setInterval(()=>{

    timer--;

    timerEl.textContent = timer;

    if(timer <= 5){
      timerEl.style.color = "#c62828";
    }

    if(timer <= 0){

      clearInterval(interval);

      gameOver = true;

      gameOverEl.textContent = "⏰ Partie terminée !";

      restartBtn.style.display = "inline-block";
    }

  },1000);
}

function popup(x,y,text){

  const p = document.createElement("div");

  p.className = "popup";

  p.textContent = text;

  p.style.left = x + "px";
  p.style.top = y + "px";

  document.body.appendChild(p);

  setTimeout(()=>{
    p.remove();
  },1000);
}

function confetti(){

  const emojis = [
    "🎉",
    "✨",
    "🍎",
    "🍏",
    "🏆",
    "⭐"
  ];

  for(let i=0;i<25;i++){

    const c = document.createElement("div");

    c.className = "confetti";

    c.textContent =
      emojis[Math.floor(Math.random()*emojis.length)];

    c.style.left =
      Math.random()*100 + "vw";

    c.style.animationDuration =
      (2 + Math.random()*2) + "s";

    document.body.appendChild(c);

    setTimeout(()=>{
      c.remove();
    },4000);
  }
}

function unlockAchievement(text){

  if(achievements.includes(text)) return;

  achievements.push(text);

  const div = document.createElement("div");

  div.className = "achievement";

  div.textContent = "🏆 " + text;

  achievementsEl.appendChild(div);

  confetti();
}

function resetGame(){

  score = 0;
  combo = 0;
  timer = 30;

  gameStarted = false;
  gameOver = false;

  scoreEl.textContent = 0;
  comboEl.textContent = 0;
  timerEl.textContent = 30;

  timerEl.style.color = "#2e7d32";

  messageEl.textContent =
    "Clique sur la pomme 🍎";

  gameOverEl.textContent = "";

  restartBtn.style.display = "none";

  achievementsEl.innerHTML = "";

  achievements.length = 0;
}

restartBtn.addEventListener("click", resetGame);

appleBtn.addEventListener("click",(e)=>{

  if(gameOver) return;

  if(!gameStarted){

    gameStarted = true;

    startTimer();
  }

  let gain = 1;

  let random = Math.random();

  // 🍏 pomme rare
  if(random < 0.05){

    gain = 10;

    timer += 2;

    timerEl.textContent = timer;

    messageEl.textContent =
      "🍏 POMME RARE +10";

    appleBtn.textContent = "🍏";
  }

  // 💎 jackpot
  if(random < 0.01){

    gain = 25;

    timer += 5;

    timerEl.textContent = timer;

    messageEl.textContent =
      "💎 JACKPOT +25";

    appleBtn.textContent = "💎";
  }

  // 🔥 combo
  combo++;

  comboEl.textContent = combo;

  clearTimeout(comboTimeout);

  comboTimeout = setTimeout(()=>{

    combo = 0;

    comboEl.textContent = combo;

  },1200);

  if(combo >= 10){

    gain *= 5;

    messageEl.textContent =
      "🔥 COMBO x5";
  }

  else if(combo >= 5){

    gain *= 2;

    messageEl.textContent =
      "⚡ COMBO x2";
  }

  score += gain;

  scoreEl.textContent = score;

  popup(e.clientX,e.clientY,"+" + gain);

  // 🏆 succès

  if(score >= 50){
    unlockAchievement("50 points !");
  }

  if(score >= 100){
    unlockAchievement("100 points !");
  }

  if(score >= 250){
    unlockAchievement("250 points !");
  }

  if(combo >= 10){
    unlockAchievement("Combo x10 !");
  }

  if(combo >= 20){
    unlockAchievement("Combo x20 !");
  }

  // 🎉 bonus

  if(score % 50 === 0){
    confetti();
  }

  setTimeout(()=>{
    appleBtn.textContent = "🍎";
  },300);

});

</script>

</body>
</html>
