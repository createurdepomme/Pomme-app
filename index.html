<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pomme</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  background-color: #aed581;
  /* La formule magique pour les téléphones (Safari/Chrome mobile) */
  height: -webkit-fill-available;
}

body {
  margin: 0;
  padding: 0;
  width: 100vw;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Nunito', sans-serif;
  
  /* --- RÉGLAGES DU FOND D'ÉCRAN FORCÉS --- */
  background-size: cover !important; 
  background-position: center center !important;
  background-repeat: no-repeat !important;
  background-attachment: scroll !important; /* Évite les bugs de bandes sur iOS */
  
  overflow: hidden;
  transition: background-image 0.5s ease;
  
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

.card {
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.5);
  border-radius: 32px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,0.22);
  position: absolute;
  width: 360px;
  padding: 32px 28px 28px;
  transition: opacity 0.35s, transform 0.35s;
}
.card.hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }

h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  color: #1b5e20;
  text-shadow: 1px 2px 0 rgba(255,255,255,0.6);
  margin-bottom: 6px;
}

h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 1.6rem;
  color: #1b5e20;
  text-shadow: 1px 2px 0 rgba(255,255,255,0.5);
  margin-bottom: 10px;
}

p {
  font-size: 1rem;
  font-weight: 700;
  color: #2e7d32;
  margin-bottom: 18px;
}

.btn-green, .btn-red, .btn-orange, .btn-blue {
  padding: 10px 26px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.1s;
}

.btn-red { background: linear-gradient(135deg,#e53935,#b71c1c); box-shadow: 0 4px 0 #7f0000; }
