<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pomme</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>
html, body {
  touch-action: manipulation;
}

button {
  touch-action: manipulation;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Nunito', sans-serif;
  background-image:url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854');
  background-size:cover;
  background-position:center;
  overflow:hidden;
}

/* GAME UI */
.overlay {
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 36px;
  border-radius: 30px;
  text-align:center;
  width:360px;
}

h1 {
  font-family:'Fredoka One';
}

/* BUTTON */
#appleBtn {
  width:200px;
  height:200px;
  border:none;
  border-radius:50%;
  font-size:90px;
  cursor:pointer;
  background: radial-gradient(circle, #fff, #ffb3b3);
}

/* LEADERBOARD (IMPORTANT) */
#leaderboardBox {
  display:none; /* caché au début */
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:20px;
}

#leaderboard {
  text-align:left;
  margin-top:10px;
  line-height:1.6;
}

#pseudo {
  width:100%;
  padding:10px;
  margin-top:10px;
}

#leaderboardBox button {
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#43a047;
  color:white;
  border:none;
  border-radius:10px;
}

/* FIN DE PARTIE */
#timeupMsg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  color:white;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<div class="overlay">

  <h1>🍎 Pomme</h1>

  <div>⏱ <span id="timerDisplay">30</span></div>
  <div>🏆 Record : <span id="bestScore">0</span></div>

  <button id="appleBtn">🍎</button>

  <div id="counter">Clics : 0</div>

  <button onclick="resetGame()">Recommencer</button>
</div>

<!-- FIN -->
<div id="timeupMsg">

  <h2>Temps écoulé !</h2>
  <p id="finalMsg"></p>

  <input id="pseudo" placeholder="Ton pseudo">

  <button onclick="sendScore()">Envoyer score</button>

  <button onclick="showLeaderboard()">Voir classement</button>

  <button onclick="resetGame()">Rejouer</button>

  <!-- CLASSEMENT -->
  <div id="leaderboardBox">
    <h3>🏆 Classement</h3>
    <div id="leaderboard">Aucun score</div>
  </div>

</div>

<script>

let clicks = 0;
let timer = 30;
let interval;
let best = localStorage.getItem("best") || 0;

document.getElementById("bestScore").textContent = best;

const btn = document.getElementById("appleBtn");
const counter = document.getElementById("counter");
const timerDisplay = document.getElementById("timerDisplay");
const finalMsg = document.getElementById("finalMsg");
const timeupMsg = document.getElementById("timeupMsg");
const leaderboardBox = document.getElementById("leaderboardBox");

btn.onclick = () => {
  clicks++;
  counter.textContent = "Clics : " + clicks;
  if (!interval) startTimer();
};

function startTimer() {
  interval = setInterval(() => {
    timer--;
    timerDisplay.textContent = timer;
    if (timer <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(interval);

  if (clicks > best) {
    best = clicks;
    localStorage.setItem("best", best);
  }

  finalMsg.textContent = "Score : " + clicks + " | Record : " + best;

  timeupMsg.style.display = "flex";

  // IMPORTANT : reset affichage leaderboard
  leaderboardBox.style.display = "none";
}

function resetGame() {
  clicks = 0;
  timer = 30;
  interval = null;

  counter.textContent = "Clics : 0";
  timerDisplay.textContent = "30";
  timeupMsg.style.display = "none";
  leaderboardBox.style.display = "none";
}

function sendScore() {
  let pseudo = document.getElementById("pseudo").value.trim();
  if (pseudo === "") pseudo = "Joueur";

  let scores = JSON.parse(localStorage.getItem("scores") || "[]");

  scores.push({ name: pseudo, score: clicks });

  scores.sort((a,b) => b.score - a.score);
  scores = scores.slice(0,10);

  localStorage.setItem("scores", JSON.stringify(scores));

  loadScores();
}

function loadScores() {
  let scores = JSON.parse(localStorage.getItem("scores") || "[]");

  let html = "";

  scores.forEach((s,i) => {
    html += `${i+1}. ${s.name} - ${s.score}<br>`;
  });

  document.getElementById("leaderboard").innerHTML =
    html || "Aucun score";
}

function showLeaderboard() {
  leaderboardBox.style.display = "block";
  loadScores();
}

</script>

</body>
</html>
