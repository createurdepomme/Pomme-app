<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pomme</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Nunito;
  background:url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854') center/cover;
  overflow:hidden;
}

.card {
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(18px);
  border-radius:30px;
  width:360px;
  padding:30px;
  text-align:center;
  position:absolute;
}

.hidden { display:none; }

h1,h2 { font-family:Fredoka One; color:#1b5e20; }

button {
  border:none;
  padding:10px 20px;
  border-radius:40px;
  cursor:pointer;
  font-family:Fredoka One;
}

.btn-green { background:#43a047; color:#fff; }
.btn-red { background:#e53935; color:#fff; }

#appleBtn {
  font-size:80px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#ffb3b3);
  margin:15px 0;
}

#counter { font-size:22px; font-weight:bold; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="screen-name">
  <h1>🍎 Pomme</h1>
  <input id="nameInput" placeholder="Pseudo..." style="padding:10px;border-radius:20px;margin:10px;">
  <button class="btn-green" id="nameBtn">Jouer</button>
</div>

<!-- GAME -->
<div class="card hidden" id="screen-game">
  <h2>🍎 Pomme</h2>

  <div>⏱ <span id="timer">30</span>s</div>

  <button id="appleBtn">🍎</button>

  <div id="counter">0</div>

  <button class="btn-red" id="resetBtn">Restart</button>
</div>

<!-- END -->
<div class="card hidden" id="screen-end">
  <h2>Fin !</h2>
  <div id="finalMsg"></div>

  <h3>🏆 Classement</h3>
  <div id="leaderboard"></div>

  <button class="btn-green" id="replayBtn">Rejouer</button>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ───── SUPABASE ─────
const supabase = window.supabase.createClient(
  "https://qaofelxfekofzkuhsvir.supabase.co",
  "sb_publishable_SqjV6YlK0Ju1lAEE6imVkw_JtgiT"
);

// ───── STATE ─────
let clicks = 0;
let time = 30;
let interval;
let running = false;
let player = "";

// ───── ELEMENTS ─────
const screenName = document.getElementById("screen-name");
const screenGame = document.getElementById("screen-game");
const screenEnd = document.getElementById("screen-end");

const counter = document.getElementById("counter");
const timer = document.getElementById("timer");
const btn = document.getElementById("appleBtn");

// ───── NAV ─────
function show(el){
  screenName.classList.add("hidden");
  screenGame.classList.add("hidden");
  screenEnd.classList.add("hidden");
  el.classList.remove("hidden");
}

// ───── START GAME ─────
function startGame(){
  clicks = 0;
  time = 30;
  running = false;

  counter.textContent = 0;
  timer.textContent = 30;

  show(screenGame);
}

// ───── TIMER ─────
function startTimer(){
  interval = setInterval(() => {
    time--;
    timer.textContent = time;

    if(time <= 0) endGame();
  }, 1000);
}

// ───── END GAME ─────
async function endGame(){
  clearInterval(interval);

  await supabase.from("scores").insert([
    { name: player, score: clicks }
  ]);

  document.getElementById("finalMsg").textContent =
    `${player} : ${clicks} clics 🍎`;

  loadLeaderboard();
  show(screenEnd);
}

// ───── CLICK ─────
btn.addEventListener("click", () => {
  if(!running){
    running = true;
    startTimer();
  }

  clicks++;
  counter.textContent = clicks;
});

// ───── NAME ─────
document.getElementById("nameBtn").addEventListener("click", () => {
  const val = document.getElementById("nameInput").value.trim();
  if(!val) return;

  player = val;
  startGame();
});

// ───── RESTART ─────
document.getElementById("replayBtn").addEventListener("click", startGame);
document.getElementById("resetBtn").addEventListener("click", startGame);

// ───── LEADERBOARD ─────
async function loadLeaderboard(){
  const { data } = await supabase
    .from("scores")
    .select("*")
    .order("score", { ascending:false })
    .limit(10);

  document.getElementById("leaderboard").innerHTML =
    data.map((e,i) =>
      `<div>#${i+1} ${e.name} - ${e.score}</div>`
    ).join("");
}
</script>

</body>
</html>
