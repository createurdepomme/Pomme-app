<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pomme</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomme">

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>
html, body {
  touch-action: manipulation;
}

button {
  touch-action: manipulation;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Nunito', sans-serif;
  background-image: url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854');
  background-size: cover;
  background-position: center;
  overflow: hidden;
}

.overlay {
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.5);
  padding: 36px;
  border-radius: 32px;
  text-align: center;
  width: 360px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.22);
}

h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 2rem;
  color: #1b5e20;
  margin-bottom: 10px;
}

.stats-row {
  display: flex;
  justify-content: space-around;
  margin-bottom: 18px;
}

.stat-box {
  background: rgba(255,255,255,0.5);
  border-radius: 14px;
  padding: 6px 18px;
  font-size: 0.85rem;
  font-weight: 900;
  color: #2e7d32;
}

.stat-box span {
  display: block;
  font-size: 1.3rem;
  color: #c62828;
}

#appleBtn {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  font-size: 100px;
  border: none;
  cursor: pointer;
  background: radial-gradient(circle, #fff, #ffb3b3);
}

#counter {
  font-size: 1.8rem;
  margin-top: 18px;
}

#leaderboardBox {
  margin-top: 20px;
  background: white;
  padding: 15px;
  border-radius: 20px;
}

#leaderboard {
  margin: 10px 0;
  font-weight: bold;
  text-align: left;
}

#pseudo {
  padding: 10px;
  width: 100%;
  margin-bottom: 10px;
}

#leaderboardBox button {
  padding: 10px;
  width: 100%;
  background: #43a047;
  color: white;
  border: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="overlay">
  <h1>🍎 Pomme</h1>

  <div class="stats-row">
    <div class="stat-box">⏱ <span id="timerDisplay">30</span></div>
    <div class="stat-box">🏆 <span id="bestScore">0</span></div>
  </div>

  <button id="appleBtn">🍎</button>

  <div id="counter">Clics : 0</div>

  <div id="leaderboardBox">
    <h2>🏆 Classement</h2>

    <div id="leaderboard">Chargement...</div>

    <input type="text" id="pseudo" placeholder="Ton pseudo">
    <button onclick="sendScore()">Envoyer score</button>
  </div>
</div>

<script>
let clicks = 0;
let bestScore = localStorage.getItem("pomme_best") || 0;
let timer = 30;
let gameStarted = false;
let gameOver = false;

document.getElementById("bestScore").innerText = bestScore;

const btn = document.getElementById("appleBtn");
const counter = document.getElementById("counter");

btn.addEventListener("click", () => {
  if (gameOver) return;

  if (!gameStarted) {
    gameStarted = true;
    startTimer();
  }

  clicks++;
  counter.innerText = "Clics : " + clicks;
});

function startTimer() {
  let interval = setInterval(() => {
    timer--;
    document.getElementById("timerDisplay").innerText = timer;

    if (timer <= 0) {
      clearInterval(interval);
      endGame();
    }
  }, 1000);
}

function endGame() {
  gameOver = true;

  window.lastScore = clicks;

  if (clicks > bestScore) {
    bestScore = clicks;
    localStorage.setItem("pomme_best", bestScore);
    document.getElementById("bestScore").innerText = bestScore;
  }
}

function sendScore() {
  let pseudo = document.getElementById("pseudo").value;
  if (pseudo === "") pseudo = "Joueur";

  let scores = JSON.parse(localStorage.getItem("pomme_scores") || "[]");

  scores.push({
    name: pseudo,
    score: window.lastScore || clicks
  });

  scores.sort((a, b) => b.score - a.score);
  scores = scores.slice(0, 10);

  localStorage.setItem("pomme_scores", JSON.stringify(scores));

  loadScores();
}

function loadScores() {
  let scores = JSON.parse(localStorage.getItem("pomme_scores") || "[]");

  let html = "";

  scores.forEach((s, i) => {
    html += (i + 1) + ". " + s.name + " - " + s.score + "<br>";
  });

  document.getElementById("leaderboard").innerHTML =
    html || "Aucun score";
}

loadScores();

// Bloque zoom iPhone
document.addEventListener("gesturestart", function(e) {
  e.preventDefault();
});
</script>

</body>
</html>
