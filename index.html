<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 Pomme Magique</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Nunito', sans-serif;
  background-image:url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854');
  background-size:cover;
  background-position:center;
  overflow:hidden;
}

.overlay {
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(18px);
  padding:36px;
  border-radius:32px;
  width:360px;
  text-align:center;
  box-shadow:0 16px 40px rgba(0,0,0,0.22);
}

h1 {
  font-family:'Fredoka One';
  color:#1b5e20;
  margin-bottom:10px;
}

.stats-row {
  display:flex;
  justify-content:space-around;
  margin-bottom:15px;
}

.stat-box {
  background:rgba(255,255,255,0.5);
  padding:8px 14px;
  border-radius:12px;
  font-weight:900;
  color:#2e7d32;
}

#appleBtn {
  width:200px;
  height:200px;
  border:none;
  border-radius:50%;
  font-size:90px;
  cursor:pointer;
  background:radial-gradient(circle,#fff,#ffb3b3);
  animation:float 3s infinite;
}

@keyframes float {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

#counter,#message,#niveau {
  margin-top:10px;
  font-weight:900;
}

.progress-wrap {
  margin-top:10px;
  height:10px;
  background:#0002;
  border-radius:20px;
  overflow:hidden;
}

#progressBar {
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#66bb6a,#e53935);
}

#resetBtn {
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:20px;
  background:#e53935;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* LEADERBOARD */
#leaderboardBox {
  margin-top:15px;
  background:white;
  padding:12px;
  border-radius:15px;
}

#leaderboardBox h2 {
  font-size:18px;
  margin-bottom:8px;
}

#leaderboard {
  text-align:left;
  font-weight:bold;
  margin-bottom:10px;
}

#pseudo {
  width:100%;
  padding:8px;
  margin-bottom:8px;
}

#leaderboardBox button {
  width:100%;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#43a047;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="overlay">
  <h1>🍎 Pomme Magique</h1>

  <div class="stats-row">
    <div class="stat-box">⏱ <span id="timerDisplay">30</span></div>
    <div class="stat-box">🏆 <span id="bestScore">0</span></div>
  </div>

  <button id="appleBtn">🍎</button>

  <div id="counter">Clics : 0</div>
  <div id="message">Appuie pour commencer !</div>
  <div id="niveau">Niveau 1 🌱</div>

  <div class="progress-wrap">
    <div id="progressBar"></div>
  </div>

  <button id="resetBtn">🔄 Recommencer</button>

  <!-- CLASSEMENT -->
  <div id="leaderboardBox">
    <h2>🏆 Classement</h2>
    <div id="leaderboard">Aucun score</div>
    <input id="pseudo" placeholder="Ton pseudo">
    <button onclick="sendScore()">Envoyer score</button>
  </div>
</div>

<div id="timeupMsg" style="display:none;"></div>

<script>
let clicks=0;
let bestScore=parseInt(localStorage.getItem("best")||0);
let timer=30;
let interval;
let started=false;
let gameOver=false;

const messages=["Miam ! 😋","Super ! 🔥","Incroyable ! 🎉","Bravo ! 🏆"];

const btn=document.getElementById("appleBtn");
const counter=document.getElementById("counter");
const msg=document.getElementById("message");
const timerDisplay=document.getElementById("timerDisplay");
const best=document.getElementById("bestScore");
const progress=document.getElementById("progressBar");

best.textContent=bestScore;

function startTimer(){
  interval=setInterval(()=>{
    timer--;
    timerDisplay.textContent=timer;
    if(timer<=0) end();
  },1000);
}

function end(){
  clearInterval(interval);
  gameOver=true;
  if(clicks>bestScore){
    bestScore=clicks;
    localStorage.setItem("best",bestScore);
  }
}

btn.onclick=(e)=>{
  if(gameOver) return;

  if(!started){
    started=true;
    startTimer();
  }

  clicks++;
  counter.textContent="Clics : "+clicks;
  msg.textContent=messages[Math.floor(Math.random()*messages.length)];

  if(clicks<20) progress.style.width=(clicks/20*100)+"%";
  else progress.style.width="100%";
};

/* RESET */
document.getElementById("resetBtn").onclick=()=>{
  clicks=0;
  timer=30;
  started=false;
  gameOver=false;
  counter.textContent="Clics : 0";
  timerDisplay.textContent="30";
  msg.textContent="Appuie pour commencer !";
};

/* ───── LEADERBOARD ───── */
function sendScore(){
  let name=document.getElementById("pseudo").value || "Joueur";

  let scores=JSON.parse(localStorage.getItem("scores")||"[]");

  scores.push({name,score:clicks});
  scores.sort((a,b)=>b.score-a.score);
  scores=scores.slice(0,10);

  localStorage.setItem("scores",JSON.stringify(scores));

  loadScores();
}

function loadScores(){
  let scores=JSON.parse(localStorage.getItem("scores")||"[]");

  let html="";
  scores.forEach((s,i)=>{
    html+=`${i+1}. ${s.name} - ${s.score}<br>`;
  });

  document.getElementById("leaderboard").innerHTML=
    html || "Aucun score";
}

loadScores();
</script>

</body>
</html>
