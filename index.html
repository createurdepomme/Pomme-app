<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pomme</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomme">

<style>
html, body {
  touch-action: manipulation;
  user-select: none;
  overflow: hidden;
  font-family: Arial;
}

button {
  touch-action: manipulation;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f2f2f2;
}

.overlay {
  background:white;
  padding:20px;
  border-radius:20px;
  width:320px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

#appleBtn {
  width:150px;
  height:150px;
  font-size:60px;
  border-radius:50%;
  border:none;
  background:#ff3b3b;
  color:white;
  margin:15px 0;
}

#leaderboardBox {
  margin-top:15px;
  padding:10px;
  background:#fafafa;
  border-radius:12px;
}
input, button {
  width:100%;
  padding:8px;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🍎 Pomme</h1>

<div>Score : <span id="score">0</span></div>
<div>🏆 Record : <span id="best">0</span></div>

<button id="appleBtn">🍎</button>

<button onclick="resetGame()">Reset</button>

<div id="leaderboardBox">
  <h3>🏆 Classement</h3>
  <div id="board">Chargement...</div>

  <input id="name" placeholder="Pseudo">
  <button onclick="sendScore()">Envoyer</button>
</div>

</div>

<script>

// ───── VARIABLES ─────
let score = 0;
let best = parseInt(localStorage.getItem("best") || 0);
document.getElementById("best").textContent = best;

const messages = [
  "Miam 😋","Croquant 🎵","Délicieux 🌟","Encore ✨",
  "Super 🍀","Incroyable 🎉","Trop fort 🔥","Bravo 🏆"
];

// ───── CLICK ─────
document.getElementById("appleBtn").onclick = (e) => {
  score++;
  document.getElementById("score").textContent = score;

  // message
  showMessage(messages[Math.floor(Math.random() * messages.length)], e.clientX, e.clientY);

  // son
  playSound();

  // confettis
  if (score % 10 === 0) launchConfetti();
};

// ───── RESET ─────
function resetGame() {
  if (score > best) {
    best = score;
    localStorage.setItem("best", best);
    document.getElementById("best").textContent = best;
  }
  score = 0;
  document.getElementById("score").textContent = 0;
}

// ───── LEADERBOARD ─────
function sendScore() {
  let name = document.getElementById("name").value || "Joueur";

  let data = JSON.parse(localStorage.getItem("scores") || "[]");

  data.push({ name, score });

  data.sort((a,b) => b.score - a.score);

  data = data.slice(0, 10);

  localStorage.setItem("scores", JSON.stringify(data));

  loadBoard();
}

function loadBoard() {
  let data = JSON.parse(localStorage.getItem("scores") || "[]");

  let html = "";

  data.forEach((p,i) => {
    html += (i+1) + ". " + p.name + " - " + p.score + "<br>";
  });

  document.getElementById("board").innerHTML = html || "Aucun score";
}

// ───── MESSAGE POPUP ─────
function showMessage(text, x, y) {
  const el = document.createElement("div");
  el.textContent = text;
  el.style.position = "fixed";
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.background = "rgba(0,0,0,0.7)";
  el.style.color = "white";
  el.style.padding = "6px 10px";
  el.style.borderRadius = "10px";
  el.style.transform = "translate(-50%, -50%)";
  document.body.appendChild(el);

  setTimeout(() => el.remove(), 800);
}

// ───── SON ─────
function playSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.frequency.value = 600;
  gain.gain.value = 0.1;

  osc.start();
  osc.stop(ctx.currentTime + 0.1);
}

// ───── CONFETTIS ─────
function launchConfetti() {
  const emojis = ["🍎","🍏","🎉","✨","🏆"];

  for (let i = 0; i < 20; i++) {
    const c = document.createElement("div");
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.position = "fixed";
    c.style.left = Math.random() * 100 + "vw";
    c.style.top = "-20px";
    c.style.fontSize = "20px";
    c.style.animation = "fall 2s linear forwards";

    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

// animation confetti
const style = document.createElement("style");
style.innerHTML = `
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}`;
document.head.appendChild(style);

// ───── LOAD ─────
loadBoard();

// ───── ANTI ZOOM ─────
document.addEventListener("gesturestart", e => e.preventDefault());

</script>

</body>
</html>
