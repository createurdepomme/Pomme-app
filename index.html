<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pomme</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }

body {
  /* On force la hauteur stricte de l'écran et on enlève les marges */
  margin: 0;
  padding: 0;
  height: 100dvh; 
  width: 100vw;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Nunito', sans-serif;
  background-color: #aed581;
  
  /* Le fond d'écran remplira tout sans décrocher */
  background-size: cover; 
  background-position: center;
  background-repeat: no-repeat;
  
  overflow: hidden;
  transition: background-image 0.5s ease;
}

  
  /* --- RÉGLAGES DU FOND D'ÉCRAN --- */
  background-size: cover; 
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  
  overflow: hidden;
  transition: background-image 0.5s ease;
}


.card {
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.5);
  border-radius: 32px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,0.22);
  position: absolute;
  width: 360px;
  padding: 32px 28px 28px;
  transition: opacity 0.35s, transform 0.35s;
}
.card.hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }

h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  color: #1b5e20;
  text-shadow: 1px 2px 0 rgba(255,255,255,0.6);
  margin-bottom: 6px;
}
h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 1.6rem;
  color: #1b5e20;
  text-shadow: 1px 2px 0 rgba(255,255,255,0.5);
  margin-bottom: 10px;
}
p {
  font-size: 1rem;
  font-weight: 700;
  color: #2e7d32;
  margin-bottom: 18px;
}

.btn-green, .btn-red, .btn-orange, .btn-blue {
  padding: 10px 26px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn-green  { background: linear-gradient(135deg,#43a047,#1b5e20); box-shadow: 0 4px 0 #0a3d0a; }
.btn-red    { background: linear-gradient(135deg,#e53935,#b71c1c); box-shadow: 0 4px 0 #7f0000; }
.btn-orange { background: linear-gradient(135deg,#ff6f00,#e65100); box-shadow: 0 4px 0 #bf360c; }
.btn-blue   { background: linear-gradient(135deg,#1e88e5,#0d47a1); box-shadow: 0 4px 0 #002171; }
.btn-green:hover, .btn-red:hover, .btn-orange:hover, .btn-blue:hover { transform: translateY(-2px); }
.btn-green:active, .btn-red:active, .btn-orange:active, .btn-blue:active { transform: translateY(1px); }

input {
  padding: 10px 18px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.2rem;
  border-radius: 50px;
  border: 2px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.85);
  color: #1b5e20;
  text-align: center;
  outline: none;
  width: 220px;
  margin-bottom: 18px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.stats-row { display: flex; justify-content: space-around; margin-bottom: 14px; }
.stat-box {
  background: rgba(255,255,255,0.5);
  border-radius: 14px;
  padding: 6px 18px;
  font-size: 0.85rem;
  font-weight: 900;
  color: #2e7d32;
}
.stat-box span {
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  display: block;
  color: #c62828;
}

#appleBtn {
  width: 200px; height: 200px;
  border: none; border-radius: 50%; font-size: 100px;
  cursor: pointer;
  background: radial-gradient(circle at 35% 35%, #fff 0%, #ffe0e0 60%, #ffb3b3 100%);
  box-shadow: 0 8px 24px rgba(0,0,0,0.22), inset 0 -4px 10px rgba(0,0,0,0.08);
  transition: transform 0.12s, box-shadow 0.12s;
  animation: floatBtn 3s ease-in-out infinite;
  outline: none; z-index: 100;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
#appleBtn:disabled { pointer-events: none; opacity: 0.6; }
#appleBtn:hover:not(:disabled)  { transform: scale(1.07); }
#appleBtn:active:not(:disabled) { transform: scale(0.9); }
@keyframes floatBtn {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-10px); }
}

#counter { font-family: 'Fredoka One', cursive; font-size: 1.8rem; color: #1b5e20; margin-top: 14px; }
#message { margin-top: 8px; font-size: 1.05rem; font-weight: 900; color: #2e7d32; min-height: 26px; }
#niveau  { margin-top: 6px; font-size: 0.85rem; font-weight: 700; color: #555; }

.progress-wrap { margin-top: 10px; background: rgba(0,0,0,0.1); border-radius: 20px; height: 10px; overflow: hidden; }
#progressBar   { height: 100%; width: 0%; background: linear-gradient(90deg,#66bb6a,#e53935); border-radius: 20px; transition: width 0.2s ease; }

#resetBtn { margin-top: 14px; }

/* FIX : même style pour tous les boutons de mode */
.mode-btn {
  width: 100%;
  margin-bottom: 12px;
  text-align: left;
  padding: 14px 20px;
}
.mode-title { font-size: 1.4rem; margin-bottom: 4px; }
.mode-desc  { font-size: 0.85rem; font-weight: 400; opacity: 0.9; }

/* Play-zone : conteneur isolé pour le mode Réaction */
#play-zone {
  position: relative;
  width: 100%;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.btn-row { display: flex; gap: 10px; justify-content: center; }

#leaderboard-panel { width: 100%; max-height: 260px; overflow-y: auto; margin-bottom: 14px; }
#leaderboard-panel::-webkit-scrollbar { width: 5px; }
#leaderboard-panel::-webkit-scrollbar-thumb { background: rgba(0,100,0,0.25); border-radius: 10px; }

.lb-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 14px; margin-bottom: 5px;
  background: rgba(255,255,255,0.35);
  font-weight: 900; color: #1b5e20; font-size: 0.9rem;
}
.lb-row.gold   { background: rgba(255,215,0,0.4); }
.lb-row.silver { background: rgba(192,192,192,0.4); }
.lb-row.bronze { background: rgba(205,127,50,0.35); }
.lb-row.me     { background: rgba(100,220,100,0.4); outline: 2px solid #43a047; }
.lb-rank { font-family: 'Fredoka One', cursive; font-size: 1.1rem; width: 26px; text-align: center; }
.lb-name { flex: 1; }
.lb-score { font-family: 'Fredoka One', cursive; font-size: 1rem; color: #c62828; }

/* Boutique */
.shop-list { max-height: 240px; overflow-y: auto; margin-bottom: 14px; padding-right: 5px; }
.shop-list::-webkit-scrollbar { width: 5px; }
.shop-list::-webkit-scrollbar-thumb { background: rgba(0,100,0,0.25); border-radius: 10px; }
.shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.4); padding: 10px 14px; border-radius: 14px; margin-bottom: 8px; }
.shop-item-name { font-weight: 900; color: #1b5e20; font-size: 1rem; text-align: left; }
.shop-btn { padding: 8px 14px; font-family: 'Fredoka One', cursive; font-size: 0.9rem; border: none; border-radius: 20px; cursor: pointer; color: white; transition: transform 0.1s; }
.shop-btn.buy      { background: linear-gradient(135deg,#e53935,#b71c1c); }
.shop-btn.equip    { background: linear-gradient(135deg,#43a047,#1b5e20); }
.shop-btn.equipped { background: #9e9e9e; cursor: not-allowed; }
.shop-btn.buy:hover, .shop-btn.equip:hover { transform: translateY(-2px); }

/* Animations */
.confetti { position: fixed; animation: fall linear forwards; pointer-events: none; z-index: 999; }
@keyframes fall {
  0%   { transform: translateY(-60px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
}
.particle { position: fixed; pointer-events: none; font-size: 1.6rem; animation: burst 0.8s ease-out forwards; z-index: 998; }
@keyframes burst {
  0%   { transform: translate(0,0) scale(1.2); opacity: 1; }
  100% { transform: translate(var(--dx),var(--dy)) scale(0.2); opacity: 0; }
}
.score-popup {
  position: fixed; font-family: 'Fredoka One', cursive; font-size: 1.6rem;
  color: #fff; text-shadow: 1px 1px 0 #c62828,-1px -1px 0 #c62828;
  pointer-events: none; animation: popUp 0.9s ease-out forwards; z-index: 997;
}
@keyframes popUp {
  0%   { transform: translateY(0) scale(0.5); opacity: 1; }
  60%  { transform: translateY(-50px) scale(1.3); opacity: 1; }
  100% { transform: translateY(-90px) scale(1); opacity: 0; }
}
.flash { animation: flashAnim 0.55s ease; }
@keyframes flashAnim {
  0%   { transform: scale(1) rotate(0deg); }
  25%  { transform: scale(1.28) rotate(8deg); }
  60%  { transform: scale(0.93) rotate(-6deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.shake { animation: shakeAnim 0.4s ease; }
@keyframes shakeAnim {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-8px); }
  40%     { transform: translateX(8px); }
  60%     { transform: translateX(-5px); }
  80%     { transform: translateX(5px); }
}
</style>
</head>
<body>

<div class="card" id="screen-name">
  <h1>🍎 Pomme</h1>
  <p>Entre ton pseudo pour jouer !</p>
  <input type="text" id="nameInput" maxlength="16" placeholder="Ton pseudo..." autocomplete="off" />
  <button class="btn-green" id="nameBtn">🍎 Jouer !</button>
</div>

<div class="card hidden" id="screen-mode">
  <h1>🍎 Pomme</h1>
  <p>Choisis ton mode de jeu !</p>
  <!-- FIX : btn-orange + mode-btn sur Défi, btn-blue + mode-btn sur Boutique -->
  <button class="btn-green mode-btn" id="modeClassic">
    <div class="mode-title">⏱ CLASSIQUE</div>
    <div class="mode-desc">30 secondes • Gameplay normal</div>
  </button>
  <button class="btn-orange mode-btn" id="modeDefi">
    <div class="mode-title">⚡ DÉFI</div>
    <div class="mode-desc">40 secondes • Multiplicateurs changeants</div>
  </button>
  <button class="btn-red mode-btn" id="modeReaction">
    <div class="mode-title">🎯 RÉACTION</div>
    <div class="mode-desc">25 secondes • Le bouton se déplace !</div>
  </button>
  <button class="btn-blue mode-btn" id="goShopBtn">
    <div class="mode-title">🛒 BOUTIQUE</div>
    <div class="mode-desc">Fonds d'écran</div>
  </button>
</div>

<div class="card hidden" id="screen-shop">
  <h2>🛒 Boutique</h2>
  <div class="stats-row">
    <div class="stat-box">Banque<span id="bankDisplay">0 🍎</span></div>
  </div>
  <div class="shop-list" id="shop-items-container"></div>
  <button class="btn-red" id="shopHomeBtn">🏠 Retour</button>
</div>

<div class="card hidden" id="screen-game">
  <h1>Pomme</h1>
  <div class="stats-row">
    <div class="stat-box">⏱ Temps<span id="timer">30</span></div>
    <div class="stat-box">🏆 Record<span id="best">0</span></div>
  </div>
  <div id="play-zone">
    <button id="appleBtn">🍎</button>
  </div>
  <div id="counter">Clics : 0</div>
  <div id="message">Appuie pour commencer !</div>
  <div id="niveau">Niveau 1 🌱</div>
  <div class="progress-wrap"><div id="progressBar"></div></div>
  <button class="btn-red"   id="resetBtn">🔄 Recommencer</button>
  <button class="btn-green" id="gameHomeBtn" style="margin-top:8px;">🏠 Accueil</button>
</div>

<div class="card hidden" id="screen-end">
  <h2>⏰ Temps écoulé !</h2>
  <div id="finalMsg" style="font-weight:900;color:#1b5e20;margin-bottom:14px;"></div>
  <div id="leaderboard-panel">
    <div style="text-align:center;padding:16px;">Chargement... 🍎</div>
  </div>
  <div class="btn-row">
    <button class="btn-green" id="replayBtn">🔄 Rejouer</button>
    <button class="btn-red"   id="homeBtn">🏠 Accueil</button>
  </div>
</div>

<script>
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>

<script>
const SUPABASE_URL = "https://qaofelxfekofzkuhsvir.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhb2ZlbHhmZWtvZnprdWhzdmlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Mzg3NjAsImV4cCI6MjA5MzExNDc2MH0.eQI91OCDJVRz-dFr6omZlAlhQtZ06xMslArTduZJRC8";
const SB_HEADERS = { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY };

async function sbFetch(path, options = {}) {
  const res  = await fetch(SUPABASE_URL + "/rest/v1/" + path, { ...options, headers: { ...SB_HEADERS, ...(options.headers || {}) } });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(JSON.stringify(data));
  return data;
}

// === BOUTIQUE ===
const SHOP_ITEMS = [
  { id: 'bg_garden',      name: 'Potager (Base)',       price: 0,    url: 'url("Garden.jpg")' },
  { id: 'bg_countryside', name: 'Campagne',             price: 300,  url: 'url("Countryside.JPG")' },
  { id: 'bg_tuileries',   name: 'Jardin des Tuileries', price: 500,  url: 'url("Tuileries Garden.jpg")' },
  { id: 'bg_beach',       name: 'Plage',                price: 1000, url: 'url("Beach.JPG")' }
];

let totalBank    = parseInt(localStorage.getItem('pomme_bank')) || 0;
// FIX : id de base 'bg_garden' (et non 'bg_foret')
let purchasedBgs = JSON.parse(localStorage.getItem('pomme_inventory')) || ['bg_garden'];
let currentBgId  = localStorage.getItem('pomme_equipped_bg') || 'bg_garden';

function applyBackground() {
  const bg = SHOP_ITEMS.find(i => i.id === currentBgId) || SHOP_ITEMS[0];
  document.body.style.backgroundImage = bg.url;
}
applyBackground();

// === VARIABLES ===
let clicks = 0, bestScore = 0, playerName = '', gameMode = 'classic';
let gameStarted = false, gameOver = false;
let timerLeft = 30, combo = 0, scoreMultiplier = 1, phaseMultiplier = 1, buttonSize = 200;
let timerInterval = null, comboTimeout = null, phaseTimeout = null, moveTimeout = null;

const messages = ["Miam ! 😋","Croquant ! 🎵","Délicieux ! 🌟","Encore ! ✨","Super ! 🍀","Oh là là ! 😍","Pomme d'or ! 🏆","Incroyable ! 🎊","Tu es inarrêtable ! 💪","Génie ! 🧠","Trop fort ! 🔥","Waouw ! 🤩"];

const screens = {
  name: document.getElementById('screen-name'),
  mode: document.getElementById('screen-mode'),
  game: document.getElementById('screen-game'),
  end:  document.getElementById('screen-end'),
  shop: document.getElementById('screen-shop')
};
const ui = {
  btn:      document.getElementById('appleBtn'),
  counter:  document.getElementById('counter'),
  message:  document.getElementById('message'),
  niveau:   document.getElementById('niveau'),
  progress: document.getElementById('progressBar'),
  timer:    document.getElementById('timer'),
  best:     document.getElementById('best'),
  gameCard: document.getElementById('screen-game'),
  playZone: document.getElementById('play-zone')
};

function showScreen(screen) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screen.classList.remove('hidden');
  ui.btn.style.visibility = (screen === screens.game) ? 'visible' : 'hidden';
  ui.btn.disabled = (screen !== screens.game);
}

// === NAVIGATION ===
document.getElementById('nameBtn').addEventListener('click', () => {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) { document.getElementById('nameInput').focus(); return; }
  playerName = val;
  localStorage.setItem('pomme_name', playerName);
  showScreen(screens.mode);
});
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('nameBtn').click(); });
document.getElementById('modeClassic').addEventListener('click',  () => { gameMode = 'classic';  startGame(); });
document.getElementById('modeDefi').addEventListener('click',     () => { gameMode = 'defi';     startGame(); });
document.getElementById('modeReaction').addEventListener('click', () => { gameMode = 'reaction'; startGame(); });
document.getElementById('goShopBtn').addEventListener('click',    () => { renderShop(); showScreen(screens.shop); });
document.getElementById('shopHomeBtn').addEventListener('click',  () => showScreen(screens.mode));
document.getElementById('resetBtn').addEventListener('click',     startGame);
document.getElementById('replayBtn').addEventListener('click',    startGame);
document.getElementById('gameHomeBtn').addEventListener('click',  () => {
  clearInterval(timerInterval); clearTimeout(moveTimeout); clearTimeout(phaseTimeout);
  showScreen(screens.mode);
});
document.getElementById('homeBtn').addEventListener('click', () => {
  clearInterval(timerInterval); clearTimeout(moveTimeout);
  showScreen(screens.mode);
});

// === BOUTIQUE ===
function renderShop() {
  document.getElementById('bankDisplay').textContent = totalBank + ' 🍎';
  const container = document.getElementById('shop-items-container');
  container.innerHTML = '';
  SHOP_ITEMS.forEach(item => {
    const isOwned    = purchasedBgs.includes(item.id);
    const isEquipped = currentBgId === item.id;
    const btnHtml = isEquipped
      ? `<button class="shop-btn equipped" disabled>Équipé</button>`
      : isOwned
        ? `<button class="shop-btn equip" onclick="equipBg('${item.id}')">Équiper</button>`
        : `<button class="shop-btn buy" onclick="buyBg('${item.id}',${item.price})">${item.price} 🍎</button>`;
    container.innerHTML += `<div class="shop-item"><span class="shop-item-name">${item.name}</span>${btnHtml}</div>`;
  });
}
window.buyBg = function(id, price) {
  if (totalBank >= price) {
    totalBank -= price; purchasedBgs.push(id);
    localStorage.setItem('pomme_bank', totalBank);
    localStorage.setItem('pomme_inventory', JSON.stringify(purchasedBgs));
    renderShop(); showPopup(window.innerWidth/2, window.innerHeight/2, "Acheté ! 🎉");
  } else { alert("Pas assez de pommes en banque ! 🍎"); }
};
window.equipBg = function(id) {
  currentBgId = id;
  localStorage.setItem('pomme_equipped_bg', currentBgId);
  applyBackground(); renderShop();
};

// === DÉMARRAGE DU JEU ===
function startGame() {
  clicks = 0;
  timerLeft = gameMode === 'defi' ? 40 : gameMode === 'reaction' ? 25 : 30;
  gameStarted = false; gameOver = false;
  combo = 0; scoreMultiplier = 1; phaseMultiplier = 1; buttonSize = 200;

  clearInterval(timerInterval); clearTimeout(comboTimeout); clearTimeout(phaseTimeout); clearTimeout(moveTimeout);

  ui.counter.textContent  = "Clics : 0";
  ui.message.textContent  = gameMode === 'defi' ? "⚡ Mode DÉFI - Multiplicateurs changeants !" : gameMode === 'reaction' ? "🎯 Mode RÉACTION - Attrape la pomme !" : "Appuie pour commencer !";
  ui.niveau.textContent   = gameMode === 'defi' ? "DÉFI 🔥" : gameMode === 'reaction' ? "RÉACTION 🎯" : "Niveau 1 🌱";
  ui.timer.textContent    = timerLeft;
  ui.timer.parentElement.style.color = '#2e7d32';
  ui.progress.style.width = "0%";
  ui.btn.textContent      = "🍎";
  ui.btn.style.position   = "relative";
  ui.btn.style.left       = "auto";
  ui.btn.style.top        = "auto";
  ui.btn.style.width      = "200px";
  ui.btn.style.height     = "200px";
  ui.btn.style.fontSize   = "100px";
  ui.btn.style.transition = "";
  ui.btn.disabled         = false;

  // FIX : record séparé par mode
  bestScore = parseInt(localStorage.getItem('pomme_best_' + gameMode)) || 0;
  ui.best.textContent = bestScore;
  showScreen(screens.game);
}

// === AUDIO ===
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick() {
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination); osc.type = 'sine';
  osc.frequency.setValueAtTime(520, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
  g.gain.setValueAtTime(0.25, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
  osc.start(); osc.stop(audioCtx.currentTime + 0.12);
}
function playBonus() {
  [0,0.12,0.24].forEach((delay, i) => {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination); osc.type = 'triangle';
    osc.frequency.setValueAtTime([523,659,784][i], audioCtx.currentTime + delay);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.2);
    osc.start(audioCtx.currentTime + delay); osc.stop(audioCtx.currentTime + delay + 0.22);
  });
}

// === CLIC POMME ===
ui.btn.addEventListener('click', (e) => {
  if (gameOver || ui.btn.disabled) return;
  if (!gameStarted) { gameStarted = true; startTimer(); }
  audioCtx.resume();

  let gain = 1;
  if (Math.random() < 0.08) {
    gain = 5; ui.btn.textContent = "🍏"; ui.message.textContent = "🍏 POMME RARE +5 !!!";
    setTimeout(() => { ui.btn.textContent = "🍎"; }, 500);
  }
  if (gameMode === 'defi') gain *= phaseMultiplier;
  gain *= scoreMultiplier;
  clicks += gain;

  combo++;
  clearTimeout(comboTimeout);
  comboTimeout = setTimeout(() => { combo = 0; scoreMultiplier = 1; }, 1500);
  scoreMultiplier = combo >= 10 ? 3 : combo >= 5 ? 2 : 1;

  playClick();
  ui.counter.textContent = "Clics : " + clicks;
  let msg = messages[Math.floor(Math.random() * messages.length)];
  if (gameMode === 'defi')     msg += ` (×${phaseMultiplier})`;
  if (gameMode === 'reaction') msg  = "🎯 Attrapée !";
  ui.message.textContent = msg;

  updateProgress();
  spawnParticles(e.clientX, e.clientY);
  showPopup(e.clientX, e.clientY, "+1");

  if (clicks % 100 === 0) { timerLeft += 5; showPopup(e.clientX, e.clientY - 60, "+5s ⏱"); }

  if (clicks % 10 === 0) {
    playBonus();
    ui.btn.classList.remove("flash"); void ui.btn.offsetWidth; ui.btn.classList.add("flash");
    ui.gameCard.classList.remove("shake"); void ui.gameCard.offsetWidth; ui.gameCard.classList.add("shake");
    launchConfetti();
    showPopup(e.clientX, e.clientY - 30, "BONUS ! 🎉");
  }
  if (gameMode === 'reaction') moveButton();
}, { passive: false });

function updateProgress() {
  let prev = 0, next = 20;
  if (gameMode === 'classic') {
    if      (clicks < 20)  { prev = 0;   next = 20;  }
    else if (clicks < 50)  { prev = 20;  next = 50;  }
    else if (clicks < 100) { prev = 50;  next = 100; }
    else                   { prev = 100; next = 200; }
    ui.niveau.textContent = clicks < 20 ? "Niveau 1 🌱" : clicks < 50 ? "Niveau 2 🍀" : clicks < 100 ? "Niveau 3 🔥" : clicks < 200 ? "Niveau 4 ⚡" : "Niveau MAX 👑";
  } else { next = gameMode === 'defi' ? 500 : 300; }
  ui.progress.style.width = Math.min((clicks - prev) / (next - prev) * 100, 100) + '%';
}

function startTimer() {
  if (gameMode === 'defi')     changePhase();
  if (gameMode === 'reaction') moveButton();
  timerInterval = setInterval(() => {
    timerLeft--;
    ui.timer.textContent = timerLeft;
    if (timerLeft <= 5) ui.timer.parentElement.style.color = '#c62828';
    if (timerLeft <= 0) endGame();
  }, 1000);
}

function changePhase() {
  if (gameMode !== 'defi' || gameOver) return;
  phaseMultiplier = [2,3,4][Math.floor(Math.random() * 3)];
  showPopup(window.innerWidth / 2, 200, `Phase ×${phaseMultiplier} ! ⚡`);
  clearTimeout(phaseTimeout);
  phaseTimeout = setTimeout(() => changePhase(), 4000 + Math.random() * 2000);
}

function moveButton() {
  if (gameMode !== 'reaction' || gameOver) return;
  buttonSize = Math.max(80, buttonSize - 8);
  ui.btn.style.width    = buttonSize + "px";
  ui.btn.style.height   = buttonSize + "px";
  ui.btn.style.fontSize = (buttonSize * 0.5) + "px";

  // FIX : rester dans la play-zone (overflow:hidden), jamais en dehors
  const zoneW = ui.playZone.offsetWidth;
  const zoneH = ui.playZone.offsetHeight;
  const margin = 10;
  const maxX = Math.max(0, zoneW - buttonSize - margin);
  const maxY = Math.max(0, zoneH - buttonSize - margin);

  ui.btn.style.position   = "absolute";
  ui.btn.style.transition = "left 0.15s ease, top 0.15s ease";
  ui.btn.style.left = (margin + Math.random() * maxX) + "px";
  ui.btn.style.top  = (margin + Math.random() * maxY) + "px";

  const speed = Math.max(600, 1200 - clicks * 10);
  clearTimeout(moveTimeout);
  moveTimeout = setTimeout(() => moveButton(), speed);
}

async function endGame() {
  clearInterval(timerInterval); clearTimeout(moveTimeout);
  gameOver = true; ui.btn.disabled = true;

  totalBank += clicks;
  localStorage.setItem('pomme_bank', totalBank);

  // FIX : mettre à jour le record seulement si meilleur score
  if (clicks > bestScore) {
    bestScore = clicks;
    localStorage.setItem('pomme_best_' + gameMode, bestScore);
  }

  const modeLabel = gameMode === 'defi' ? '⚡ DÉFI' : gameMode === 'reaction' ? '🎯 RÉACTION' : '⏱ CLASSIQUE';
  document.getElementById('finalMsg').innerHTML =
    `${playerName}, tu as cliqué ${clicks} fois ! 🍎<br>Gains ajoutés à la banque. 💰<br>Record : ${bestScore}`;
  showScreen(screens.end);

  // FIX : envoyer bestScore (jamais écraser un meilleur score)
  await saveScore(playerName, bestScore, gameMode);
  await renderLeaderboard();
}

async function saveScore(name, score, mode) {
  try {
    const existing = await sbFetch(`scores?name=eq.${encodeURIComponent(name)}&mode=eq.${encodeURIComponent(mode)}&select=id,score&limit=1`);
    if (existing && existing.length > 0) {
      if (score > existing[0].score) {
        await sbFetch(`scores?id=eq.${existing[0].id}`, { method: "PATCH", body: JSON.stringify({ score }) });
      }
    } else {
      await sbFetch("scores", { method: "POST", body: JSON.stringify({ name, score, mode }) });
    }
  } catch (e) { console.error('Erreur saveScore:', e.message); }
}

async function renderLeaderboard() {
  const panel = document.getElementById('leaderboard-panel');
  panel.innerHTML = '<div style="text-align:center;padding:16px;">Chargement... 🍎</div>';
  try {
    const data = await sbFetch(`scores?mode=eq.${encodeURIComponent(gameMode)}&select=name,score&order=score.desc&limit=20`);
    if (!data || data.length === 0) { panel.innerHTML = '<div style="text-align:center;padding:16px;">Aucun score pour ce mode 🍎</div>'; return; }
    const medals = ['🥇','🥈','🥉'], classes = ['gold','silver','bronze'];
    panel.innerHTML = data.map((e, i) => {
      const isMe = e.name === playerName;
      const cls  = (i < 3 ? classes[i] : '') + (isMe ? ' me' : '');
      const rank = i < 3 ? medals[i] : `#${i+1}`;
      const safe = String(e.name).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<div class="lb-row ${cls}"><span class="lb-rank">${rank}</span><span class="lb-name">${safe}</span><span class="lb-score">${e.score} 🍎</span></div>`;
    }).join('');
  } catch (e) {
    console.error('Erreur leaderboard:', e.message);
    panel.innerHTML = '<div style="text-align:center;padding:16px;">Erreur de connexion 😕</div>';
  }
}

// === EFFETS VISUELS ===
function launchConfetti() {
  const items = ["🍎","🍏","✨","🌟","🎉","🏆","💥"];
  for (let i = 0; i < 22; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = items[Math.floor(Math.random() * items.length)];
    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = (18 + Math.random() * 20) + "px";
    c.style.animationDuration = (1.2 + Math.random() * 1.8) + "s";
    c.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}
function spawnParticles(x, y) {
  const emojis = ["🍎","✨","🌿","⭐","🍃","💫"];
  for (let i = 0; i < 5; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = (Math.PI * 2 / 5) * i + Math.random() * 0.4;
    const dist = 50 + Math.random() * 70;
    p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--dy", Math.sin(angle) * dist - 30 + "px");
    p.style.left = x + "px"; p.style.top = y + "px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}
function showPopup(x, y, text) {
  const p = document.createElement("div");
  p.className = "score-popup"; p.textContent = text;
  p.style.left = x + "px"; p.style.top = y + "px";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}
</script>
