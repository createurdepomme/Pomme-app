<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pomme</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* ====== TON CSS INCHANGÉ ====== */
html, body { touch-action: manipulation; }
button { touch-action: manipulation; }
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Nunito', sans-serif;
  background-image: url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854');
  background-size: cover;
  background-position: center;
  overflow: hidden;
}

.card {
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);
  border-radius: 32px;
  text-align: center;
  position: absolute;
  width: 360px;
  padding: 32px;
  transition: opacity 0.35s, transform 0.35s;
}

.card.hidden { opacity:0; pointer-events:none; transform:scale(0.95); }

.btn-green, .btn-red {
  padding:10px 26px;
  border:none;
  border-radius:50px;
  cursor:pointer;
}

.btn-green { background:#43a047; color:white; }
.btn-red { background:#e53935; color:white; }

#appleBtn {
  width:200px;
  height:200px;
  border-radius:50%;
  font-size:100px;
  cursor:pointer;
}
</style>

</head>

<body>

<!-- SCREEN 1 -->
<div class="card" id="screen-name">
  <h1>🍎 Pomme</h1>
  <input id="nameInput" placeholder="Ton pseudo..." />
  <button class="btn-green" id="nameConfirmBtn">Jouer</button>
</div>

<!-- SCREEN 2 -->
<div class="card hidden" id="screen-game">
  <button id="appleBtn">🍎</button>
  <div id="counter">0</div>
  <div id="message"></div>
</div>

<!-- SCREEN 3 -->
<div class="card hidden" id="screen-end">
  <div id="finalMsg"></div>
  <div id="leaderboard-panel"></div>
  <button class="btn-green" id="replayBtn">Rejouer</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================= SUPABASE SAFE INIT ================= */

const SUPABASE_URL = "https://qaofelxfekofzkuhsvir.supabase.co";
const SUPABASE_KEY = "TON_ANON_KEY_ICI";

let supabase = null;

try {
  if (window.supabase) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) {
  console.log("Supabase non chargé");
}

/* ================= ETAT ================= */

let clicks = 0;
let playerName = "";

/* ================= DOM ================= */

const screenName = document.getElementById("screen-name");
const screenGame = document.getElementById("screen-game");
const screenEnd = document.getElementById("screen-end");

const btn = document.getElementById("appleBtn");
const counter = document.getElementById("counter");
const message = document.getElementById("message");

/* ================= NAV ================= */

function show(screen) {
  [screenName, screenGame, screenEnd].forEach(s => s.classList.add("hidden"));
  screen.classList.remove("hidden");
}

/* ================= START ================= */

function startGame() {
  clicks = 0;
  counter.textContent = "0";
  show(screenGame);
}

/* ================= PSEUDO ================= */

document.getElementById("nameConfirmBtn").onclick = () => {
  const val = document.getElementById("nameInput").value.trim();
  if (!val) return;

  playerName = val;
  startGame();
};

/* ================= CLICK GAME ================= */

btn.onclick = () => {
  clicks++;
  counter.textContent = clicks;
  message.textContent = "🍎 +1";

  if (clicks === 10) endGame();
};

/* ================= END GAME ================= */

async function endGame() {
  show(screenEnd);

  document.getElementById("finalMsg").textContent =
    `${playerName} : ${clicks} clics`;

  await saveScore(playerName, clicks);
  renderLeaderboard();
}

/* ================= SUPABASE SAVE SAFE ================= */

async function saveScore(name, score) {
  if (!supabase) return;

  try {
    await supabase.from("scores").insert([
      { name, score }
    ]);
  } catch (e) {
    console.log("Erreur saveScore", e);
  }
}

/* ================= LEADERBOARD SAFE ================= */

async function renderLeaderboard() {
  const panel = document.getElementById("leaderboard-panel");

  if (!supabase) {
    panel.innerHTML = "Supabase non disponible";
    return;
  }

  try {
    const { data, error } = await supabase
      .from("scores")
      .select("*")
      .order("score", { ascending: false })
      .limit(10);

    if (error) throw error;

    panel.innerHTML = data.map((e, i) =>
      `<div>#${i+1} ${e.name} - ${e.score}</div>`
    ).join("");

  } catch (e) {
    panel.innerHTML = "Erreur leaderboard";
    console.log(e);
  }
}

/* ================= ERROR GLOBAL ================= */

window.onerror = function(msg) {
  console.log("JS ERROR:", msg);
};
</script>

</body>
</html>
