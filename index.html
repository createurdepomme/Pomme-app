<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pomme</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
html, body {
  touch-action: manipulation;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  background:#f5f5f5;
}

/* GAME */
.overlay {
  background:white;
  padding:25px;
  border-radius:20px;
  text-align:center;
  width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

#appleBtn {
  font-size:80px;
  border:none;
  background:none;
  cursor:pointer;
}

#leaderboardBox {
  display:none; /* 👈 IMPORTANT : caché au début */
  margin-top:20px;
  padding:15px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

#leaderboard {
  margin-top:10px;
  text-align:left;
}

#timeupMsg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  color:white;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
</style>
</head>

<body>

<div class="overlay">

  <h1>Pomme 🍎</h1>

  <div>⏱ <span id="timerDisplay">30</span></div>
  <div>🏆 Record : <span id="bestScore">0</span></div>

  <button id="appleBtn">🍎</button>

  <div id="counter">Clics : 0</div>

  <button id="resetBtn">Recommencer</button>

</div>

<!-- FIN DE PARTIE -->
<div id="timeupMsg">
  <h2>Temps écoulé !</h2>
  <p id="finalMsg"></p>

  <input id="pseudo" placeholder="Ton pseudo">

  <button onclick="sendScore()">Envoyer score</button>

  <button onclick="showLeaderboard()">Voir classement</button>

  <button onclick="resetGame()">Rejouer</button>

  <!-- CLASSEMENT (caché au début) -->
  <div id="leaderboardBox">
    <h3>🏆 Classement</h3>
    <div id="leaderboard"></div>
  </div>
</div>

<script>

let clicks = 0;
let timer = 30;
let interval;
let best = localStorage.getItem("best") || 0;

document.getElementById("bestScore").textContent = best;

const btn = document.getElementById("appleBtn");
const counter = document.getElementById("counter");
const timerDisplay = document.getElementById("timerDisplay");
const finalMsg = document.getElementById("finalMsg");
const timeupMsg = document.getElementById("timeupMsg");
const leaderboardBox = document.getElementById("leaderboardBox");

btn.onclick = () => {
  clicks++;
  counter.textContent = "Clics : " + clicks;
  if (!interval) startTimer();
};

function startTimer() {
  interval = setInterval(() => {
    timer--;
    timerDisplay.textContent = timer;

    if (timer <= 0) endGame();

  }, 1000);
}

function endGame() {
  clearInterval(interval);

  if (clicks > best) {
    best = clicks;
    localStorage.setItem("best", best);
  }

  finalMsg.textContent = "Score : " + clicks + " | Record : " + best;

  timeupMsg.style.display = "flex";

  // reset affichage leaderboard
  leaderboardBox.style.display = "none";
}

function resetGame() {
  clicks = 0;
  timer = 30;
  interval = null;

  counter.textContent = "Clics : 0";
  timerDisplay.textContent = "30";
  timeupMsg.style.display = "none";
}

function sendScore() {
  let name = document.getElementById("pseudo").value || "Joueur";

  let scores = JSON.parse(localStorage.getItem("scores") || "[]");

  scores.push({ name, score: clicks });

  scores.sort((a,b) => b.score - a.score);

  scores = scores.slice(0,10);

  localStorage.setItem("scores", JSON.stringify(scores));

  loadScores();
}

function loadScores() {
  let scores = JSON.parse(localStorage.getItem("scores") || "[]");

  let html = "";

  scores.forEach((s,i) => {
    html += (i+1)+". "+s.name+" - "+s.score+"<br>";
  });

  document.getElementById("leaderboard").innerHTML = html;
}

function showLeaderboard() {
  leaderboardBox.style.display = "block";
  loadScores();
}

</script>

</body>
</html>
